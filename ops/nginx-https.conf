server {
    listen 80;
    listen [::]:80;
    server_name bmstaj.gtu.edu.tr;
    location /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
    }
    location / {
        return 308 https://bmstaj.gtu.edu.tr$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/bmstaj.gtu.edu.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bmstaj.gtu.edu.tr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name bmstaj.gtu.edu.tr;
    root /srv/gtu-its/current/frontend;
    index index.html;
    client_max_body_size 12m;

    location /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location ~* ^/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
